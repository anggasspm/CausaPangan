name: Sync Prediksi ke Database

on:
  # Dipicu setelah forecasting.yml selesai (bukan classifier.yml lagi) --
  # sync_prediksi.py sekarang butuh data/hasil_forecasting/latest.json juga,
  # dan forecasting.yml sendiri sudah dipicu setelah classifier.yml selesai,
  # jadi menunggu forecasting selesai otomatis menjamin data classifier
  # juga sudah siap.
  workflow_run:
    workflows: ["Time Series Forecasting"]
    types: [completed]
  workflow_dispatch: {}   # buat testing manual, tidak perlu nunggu forecasting jalan

permissions:
  contents: read   # cuma baca data/hasil_klasifikasi/ dan data/hasil_forecasting/, tidak commit apa pun balik ke repo

concurrency:
  group: sync-prediksi
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Jalankan sync_prediksi.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python backend/scripts/sync_prediksi.py